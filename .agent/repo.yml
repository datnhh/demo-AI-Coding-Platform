version: 1

runtime:
  image: python:3.13-slim
  workdir: /workspace

commands:
  setup: pip install --no-cache-dir -r requirements.txt
  build: python -m compileall -q src
  # `--junitxml` là bắt buộc: `pytest -q` chỉ in ra màn hình, bước kiểm chứng
  # của platform sẽ không tìm thấy file nào để đọc.
  test: pytest -q --junitxml=/workspace/test-results/results.xml

limits:
  setup_timeout_seconds: 900
  build_timeout_seconds: 300
  test_timeout_seconds: 900

context:
  docs:
    - README.md
  ignore_paths:
    - .venv/
    - __pycache__/
  protected_paths:
    - .agent/
